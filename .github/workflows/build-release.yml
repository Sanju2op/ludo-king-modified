name: Build & Release Modified Ludo King APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: false
        default: 'latest'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Dice-1-10 APK
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ───────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Java 17 ───────────────────────────────────────────────────────────
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      # ── 3. Python 3.11 ───────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ── 4. Python deps ────────────────────────────────────────────────────────
      - name: Install Python packages
        run: pip install capstone

      # ── 5. Download tools ─────────────────────────────────────────────────────
      - name: Download tools
        run: |
          mkdir -p tools
          curl -sL "https://github.com/REAndroid/APKEditor/releases/download/V1.4.1/APKEditor-1.4.1.jar" \
            -o tools/APKEditor.jar
          curl -sL "https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar" \
            -o tools/uber-apk-signer.jar
          ls -lh tools/

      # ── 6. Download the original Ludo King XAPK ──────────────────────────────
      # Add XAPK_DOWNLOAD_URL in: Settings > Secrets and variables > Actions
      - name: Download Ludo King XAPK
        env:
          XAPK_DOWNLOAD_URL: ${{ secrets.XAPK_DOWNLOAD_URL }}
        run: |
          if [ -z "$XAPK_DOWNLOAD_URL" ]; then
            echo "ERROR: XAPK_DOWNLOAD_URL secret is not set!"
            echo "Go to: Settings > Secrets and variables > Actions > New repository secret"
            echo "  Name:  XAPK_DOWNLOAD_URL"
            echo "  Value: (direct download link to the XAPK file)"
            exit 1
          fi
          echo "Downloading XAPK..."
          curl -L "$XAPK_DOWNLOAD_URL" -o com.ludo.king.xapk
          ls -lh com.ludo.king.xapk

      # ── 7. Extract split APKs from XAPK ──────────────────────────────────────
      - name: Extract XAPK
        run: |
          mkdir -p split_apks
          unzip -o com.ludo.king.xapk "*.apk" -d split_apks/
          echo "Split APKs:"
          ls -lh split_apks/

      # ── 8. Merge split APKs with APKEditor ───────────────────────────────────
      # APKEditor properly merges resources.arsc and removes all split metadata
      # producing a true standalone APK that installs on any Android device.
      - name: Merge split APKs
        run: |
          java -jar tools/APKEditor.jar m \
            -i split_apks \
            -o ludo-king-merged-raw.apk
          ls -lh ludo-king-merged-raw.apk

      # ── 9. Extract and patch libil2cpp.so (dice 1-6 to 1-10) ─────────────────
      - name: Patch libil2cpp.so
        run: |
          mkdir -p extracted_libs
          unzip -o ludo-king-merged-raw.apk "lib/arm64-v8a/libil2cpp.so" -d extracted_libs/
          ls -lh extracted_libs/lib/arm64-v8a/libil2cpp.so
          python patch/patch_dice_ci.py

      # ── 10. Inject patched libil2cpp.so back into APK ────────────────────────
      - name: Inject patched libil2cpp.so
        run: |
          python patch/inject_patched_so.py
          ls -lh ludo-king-dice10.apk

      # ── 11. Sign APK ──────────────────────────────────────────────────────────
      - name: Sign APK
        run: |
          java -jar tools/uber-apk-signer.jar \
            --apks ludo-king-dice10.apk \
            --out . \
            --allowResign
          mv ludo-king-dice10-aligned-debugSigned.apk ludo-king-modified.apk
          echo "APK_SIZE=$(du -sh ludo-king-modified.apk | cut -f1)" >> $GITHUB_ENV
          ls -lh ludo-king-modified.apk

      # ── 12. Get commit info ───────────────────────────────────────────────────
      - name: Get commit info
        id: commit
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      # ── 13. Create GitHub Release ─────────────────────────────────────────────
      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || format('v{0}-{1}', steps.commit.outputs.date, steps.commit.outputs.sha_short) }}
          name: "Ludo King Dice 1-10 (${{ steps.commit.outputs.date }})"
          body: |
            ## Ludo King Modified - Dice 1-10

            **Changes:** Dice now rolls 1-10 instead of 1-6!

            ### Installation
            1. Download `ludo-king-modified.apk`
            2. Enable "Install unknown apps" on your Android device
            3. Install and play!

            Uninstall the original Ludo King first if already installed.

            **APK size:** ${{ env.APK_SIZE }}
            **Merged using:** APKEditor (proper standalone APK, no split issues)
          files: ludo-king-modified.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
